name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-snake.svg?palette=github-light
            github-snake-dark.svg?palette=github-dark

      - name: Commit generated artwork
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update contribution snake"
          file_pattern: "github-snake.svg github-snake-dark.svg"
